extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@external"])

interface MediaItem {
  id: ID!
  title: String!
}

type Song implements MediaItem @key(fields: "id") {
  id: ID!
  title: String! @external
}

type Podcast implements MediaItem @key(fields: "id") {
  id: ID!
  title: String! @external
}

type Playlist @key(fields: "id") {
  id: ID!
  name: String!
  items: [MediaItem!]!
}

type Query {
  playlist(id: ID!): Playlist
  sanity: String!
}
